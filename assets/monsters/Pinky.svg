<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="1248" viewBox="0 0 1248 1248" role="img" aria-labelledby="title desc">
  <title id="title">Original cute pink monster illustration</title>
  <desc id="desc">A cheerful round pink monster with orange horns, big eyes, small arms, feet, teeth, and fluffy details.</desc>

  <defs>
    <radialGradient id="bodyGrad" cx="48%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="45%" stop-color="#f49ac2"/>
      <stop offset="100%" stop-color="#d85a9b"/>
    </radialGradient>

    <linearGradient id="furGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#c9468c"/>
    </linearGradient>

    <linearGradient id="hornGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7a2b58" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1248" height="1248" fill="transparent"/>

  <ellipse cx="624" cy="1148" rx="390" ry="42" fill="#8f4b73" opacity="0.16"/>

